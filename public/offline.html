<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfbf4" />
    <title>Không có mạng · Sổ bệnh án</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f3e8;
        color: #1c2420;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        background: #fdfbf4;
        border: 1px solid #e3dbc4;
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        font-size: 1.1rem;
        color: #1f4d3d;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #5c6a5f;
        line-height: 1.5;
      }
      button {
        background: #1f4d3d;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Không có kết nối mạng</h1>
      <p>Sổ bệnh án cần mạng để tải hồ sơ. Kiểm tra Wi‑Fi hoặc 4G rồi thử lại.</p>
      <button onclick="location.reload()">Thử lại</button>
    </div>
  </body>
</html>
